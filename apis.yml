description: Coveti is a curated luxury fashion marketplace that connects consumers
  with independent designers and exclusive heritage boutiques across Milan and Paris
  through what it calls "Agentic Commerce" - AI-powered personal styling. Its Fashion
  Agent builds looks for specific occasions, while The Blind Network sources from 500+
  boutiques, offering global shipping to 190+ countries, duty handling, custom 3D shoe
  design, and private client concierge services. Surfaced as a portfolio company of
  500 Global and tracked in the API Evangelist network; no public developer/API surface
  was found during enrichment.
